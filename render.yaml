services:
  - type: web
    name: pdigital-trading-bot
    runtime: node
    plan: free
    # Build the React frontend, then install the server's dependencies.
    buildCommand: npm install && npm run build && cd server && npm install
    # The Node/Express server serves the built site AND the API (no Vercel).
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # --- Database ---
      - key: MONGODB_URI
        sync: false
      # --- Security (REQUIRED) ---
      # JWT secret can be auto-generated by Render.
      - key: JWT_SECRET
        generateValue: true
      # ENCRYPTION_KEY must be a STABLE 32-byte hex string (openssl rand -hex 32).
      # Set it yourself and never change it, or stored exchange keys become
      # unreadable — so it is sync:false (you provide it), not auto-generated.
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Your public site URL (set after first deploy), e.g. https://pdigital-trading-bot.onrender.com
      - key: APP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # --- Paystack ---
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      # --- Email (optional) ---
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
